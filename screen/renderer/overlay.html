<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Выбор области</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); }
  #sel { position: fixed; display: none; border: 1px solid #3b82f6; box-shadow: 0 0 0 99999px rgba(0, 0, 0, .45);
         box-sizing: border-box; pointer-events: none; }
  #selimg { position: fixed; display: none; pointer-events: none; }
  #label { position: fixed; display: none; background: #111827; color: #fff; font: 12px/1 "Segoe UI", sans-serif;
           padding: 5px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
  #hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(17, 24, 39, .88); color: #e5e7eb;
          font: 13px/1.2 "Segoe UI", sans-serif; padding: 8px 14px; border-radius: 8px; pointer-events: none; }
  #vl, #hl { position: fixed; background: rgba(59, 130, 246, .55); pointer-events: none; }
  #vl { width: 1px; top: 0; bottom: 0; }
  #hl { height: 1px; left: 0; right: 0; }
</style>
</head>
<body>
<img id="bg" alt="" draggable="false">
<div id="dim"></div>
<div id="vl"></div><div id="hl"></div>
<div id="sel"></div>
<div id="label"></div>
<div id="hint">Выдели область мышью · Esc или правая кнопка — отмена</div>
<script src="overlay.js"></script>
</body>
</html>
