<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Recording</title>
<style>
  html, body { margin: 0; height: 100%; background: #15171c; color: #e6e8ee; font: 13px "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  #bar { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 10px 0 14px; border: 1px solid #23262e; box-sizing: border-box; border-radius: 12px; -webkit-app-region: drag; }
  #dot { width: 11px; height: 11px; border-radius: 50%; background: #ff6b6b; flex: none; animation: blink 1.2s infinite; }
  body.paused #dot { background: #f0b955; animation: none; }
  @keyframes blink { 50% { opacity: .35; } }
  #time { font: 600 17px Consolas, "Cascadia Mono", monospace; min-width: 62px; }
  #size { color: #8b90a0; font-size: 12px; flex: 1; white-space: nowrap; }
  button { -webkit-app-region: no-drag; width: 30px; height: 30px; border-radius: 8px; border: 1px solid #2f333d; background: #1b1e25; color: #e6e8ee; cursor: pointer; display: grid; place-items: center; padding: 0; }
  button:hover { border-color: #7c9cff; }
  #stop svg { fill: #ff6b6b; stroke: none; }
  svg { width: 14px; height: 14px; fill: currentColor; }
</style></head>
<body>
<div id="bar">
  <span id="dot"></span><span id="time">00:00</span><span id="size"></span>
  <button id="pause" title="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <button id="stop" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
</div>
<script src="rec-panel.js"></script>
</body></html>
